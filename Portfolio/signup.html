<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
</head>
<body>
    <h1><u>Sign up Form</u></h1>
    <h3><u>SignUp</u></h3>
    <form action="Verify.html">
    <label><u>Enter Full Name:</u></label>
    <br>
    <input type="Full Name"placeholder="Enter Name">
    <br><br>
    <label><u>Enter Email Id:</u></label>
    <br>
    <label>Email or Phone Number:</label>
    <br>
    <input type="email"placeholder="Enter email or Phone Number">
    <br><br>
    <label><u>Enter Your Password:</u></label>
    <br>
    <input type="password"placeholder="Enter Password">
    <br>
    <label for="Confirm Password"></label>
    <input type="Password"placeholder="confirm password">
    <br><br>
    <label>Enter CAPTCHA: ABC12</label>
    <br>
    <input type="text"placeholder="Enter CAPTCHA">
    <br>
    <input type="submit"value="Verify">
    </form>
</body>
</html>
